[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bakbak-python"
dynamic = ["version"]
description = "Official Python SDK for the Bakbak text-to-speech API by Raya"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Raya Voice AI", email = "support@getraya.app" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=14.2,<18",
    "typing-extensions>=4.10",
]
keywords = ["bakbak", "raya", "tts", "text-to-speech", "speech", "voice", "hindi", "indic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://docs.litwizlabs.com/documentation/sdk-python"
Repository = "https://github.com/raya-voice-ai/bakbak-python"
Issues = "https://github.com/raya-voice-ai/bakbak-python/issues"
Changelog = "https://github.com/raya-voice-ai/bakbak-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyright>=1.1.390",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/bakbak/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bakbak"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/bakbak",
    "/tests",
    "/conformance",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Live tests spend real credits: they run only with `pytest -m live`, and only
# when BAKBAK_API_KEY and BAKBAK_BASE_URL are set.
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: calls the real API (needs BAKBAK_API_KEY and BAKBAK_BASE_URL; run with -m live)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"
# A synced copy of the shared specification: never linted or reformatted here.
extend-exclude = ["conformance"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "PIE", "RET", "ASYNC", "S",
]
ignore = [
    "E501",    # the formatter owns line length
    "S101",    # assert is fine in tests and for type narrowing
    "RET505",  # else after return reads fine
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "ASYNC", "B023"]  # B023: wait helpers call their lambdas at once
"examples/**" = ["S", "ASYNC230"]  # each example writes one small file at the end

[tool.ruff.lint.isort]
known-first-party = ["bakbak"]

[tool.pyright]
include = ["src", "examples", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingModuleSource = false

[[tool.pyright.executionEnvironments]]
root = "tests"
# The tests drive the SDK with JSON fixtures, which are untyped by nature.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
reportPrivateUsage = false
reportUnknownLambdaType = false
reportTypedDictNotRequiredAccess = false

[[tool.pyright.executionEnvironments]]
root = "examples"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
